<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0c1f18">
<title>Korawish's Spinal Calculator Platform — Surgical Scoring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --panel:#ffffff;
    --ink:#0e1a15;
    --muted:#64746d;
    --line:#e8ede9;
    --green:#16855a;
    --green-d:#0c1f18;
    --green-l:#eef7f1;
    --green-mid:#27a06f;
    --accent:#d8b14a;
    --shadow:0 1px 2px rgba(12,31,24,.04),0 12px 32px rgba(12,31,24,.06);
    --r:18px;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--sans);color:var(--ink);background:#f6f9f7;
    min-height:100vh;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;
    letter-spacing:-0.011em;
  }

  /* ===== Layout ===== */
  .app{display:flex;min-height:100vh}
  .sidebar{
    flex:0 0 268px;background:#0c1f18;color:#d7e6dd;padding:26px 18px;
    position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;
  }
  .brand{display:flex;align-items:center;gap:12px;padding:4px 8px 22px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:16px}
  .brand .mark{
    flex:0 0 auto;width:44px;height:44px;border-radius:50%;position:relative;overflow:hidden;
    background:linear-gradient(135deg,var(--green-mid),var(--green));
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;
    box-shadow:0 0 0 2px rgba(255,255,255,.16);
  }
  .brand .mark img,.topbar .mark img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .brand .name{font-size:16px;font-weight:700;line-height:1.2;color:#fff;letter-spacing:-0.02em}
  .brand .name small{display:block;font-weight:500;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#7fae98;margin-top:4px}

  .navsec{font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#6fa088;margin:18px 10px 10px}
  .navitem{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:none;
    color:#c4dacd;font-family:var(--sans);font-size:14.5px;font-weight:500;letter-spacing:-0.01em;
    padding:11px 12px;border-radius:11px;cursor:pointer;margin-bottom:3px;transition:.16s;
  }
  .navitem:hover{background:rgba(255,255,255,.06);color:#fff}
  .navitem.active{background:#fff;color:var(--green-d);font-weight:700}
  .navitem .ab{
    flex:0 0 auto;width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.08);
    display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;letter-spacing:.02em;
  }
  .navitem.active .ab{background:var(--green-l);color:var(--green)}
  .navitem.soon{opacity:.55;cursor:not-allowed}
  .navitem.soon:hover{background:none;color:#c4dacd}
  .navitem .soonpill{margin-left:auto;font-size:8.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;background:rgba(255,255,255,.1);padding:3px 7px;border-radius:999px;color:#7fae98}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{display:none}
  .content{flex:1;padding:46px 40px 70px}
  .inner{max-width:780px;margin:0 auto}

  /* ===== Mobile ===== */
  @media (max-width:820px){
    .app{flex-direction:column}
    .sidebar{display:none}
    .topbar{
      display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;
      background:#0c1f18;color:#fff;padding:14px 16px;box-shadow:0 2px 16px rgba(12,31,24,.2);
    }
    .topbar .mark{flex:0 0 auto;width:36px;height:36px;border-radius:50%;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--green-mid),var(--green));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;box-shadow:0 0 0 2px rgba(255,255,255,.16)}
    .topbar .ttl{font-size:15px;font-weight:700;letter-spacing:-0.02em}
    .topbar select{margin-left:auto;background:#15362a;color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:9px 11px;font-family:var(--sans);font-size:13px;font-weight:500;max-width:52%}
    .content{padding:24px 16px 56px}
  }

  /* ===== Headings ===== */
  .pagehead{margin:0 0 8px}
  .pagehead .kicker{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--green);background:var(--green-l);padding:6px 12px;border-radius:999px;margin:0 0 16px}
  .pagehead h1{margin:0;font-size:36px;line-height:1.08;font-weight:800;letter-spacing:-0.035em}
  .pagehead p{margin:12px 0 0;color:var(--muted);font-size:16px;line-height:1.5;font-weight:400}

  /* ===== Card / groups ===== */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:26px 26px 24px;margin-top:26px}
  .card > h2{font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--green);margin:0 0 6px}
  .group{padding:22px 0;border-bottom:1px solid var(--line)}
  .group:first-of-type{padding-top:8px}
  .group:last-of-type{border-bottom:none;padding-bottom:4px}
  .group .label{display:flex;align-items:center;gap:11px;margin-bottom:15px}
  .group .num{flex:0 0 auto;width:27px;height:27px;border-radius:8px;background:var(--green-l);color:var(--green);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .group .label h3{margin:0;font-size:18px;font-weight:700;letter-spacing:-0.02em}
  .group .label .opt-multi{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--green);background:var(--green-l);padding:3px 8px;border-radius:999px;margin-left:4px}
  .group .label .hint{font-size:11px;font-weight:500;color:var(--muted);margin-left:auto;text-align:right;line-height:1.35;letter-spacing:0}
  .opts{display:grid;grid-template-columns:1fr;gap:9px}
  .opt{position:relative;display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:13px;padding:13px 15px;cursor:pointer;transition:.16s;background:#fff}
  .opt:hover{border-color:var(--green-mid);background:var(--green-l)}
  .opt input{position:absolute;opacity:0;pointer-events:none}
  .opt .dot{flex:0 0 auto;width:18px;height:18px;border-radius:50%;border:2px solid #c3d2ca;transition:.15s}
  .opt .dot.sq{border-radius:6px}
  .opt .txt{font-size:15px;font-weight:500;flex:1;letter-spacing:-0.01em}
  .opt .txt .sub{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:2px;line-height:1.35}
  .opt .pts{flex:0 0 auto;font-weight:700;font-size:13px;color:var(--muted);background:#f1f5f2;border-radius:999px;padding:3px 11px;min-width:34px;text-align:center}
  .opt input:checked ~ .dot{border-color:var(--green);background:radial-gradient(circle at 50% 50%,var(--green) 0 6px,#fff 6px 9px)}
  .opt input:checked ~ .dot.sq{border-color:var(--green);background:var(--green)}
  .opt:has(input:checked){border-color:var(--green);background:var(--green-l);box-shadow:0 0 0 3px rgba(22,133,90,.12)}
  .opt:has(input:checked) .pts{background:var(--green);color:#fff}

  .textfield{display:block;width:100%;font-family:var(--sans);font-size:15px;font-weight:500;color:var(--ink);border:1.5px solid var(--line);border-radius:13px;padding:13px 15px;background:#fff}
  .textfield:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(22,133,90,.12)}

  /* ===== Result ===== */
  .result{margin-top:26px;border-radius:var(--r);overflow:hidden;background:#0c1f18;border:1px solid #0c1f18;color:#eaf4ee;box-shadow:var(--shadow)}
  .result .equation{padding:18px 22px;font-size:13.5px;font-weight:500;color:#a9c9b8;border-bottom:1px solid rgba(255,255,255,.07);line-height:1.7;min-height:18px}
  .result .equation b{color:#fff;font-weight:700}
  .result .scorebar{display:flex;align-items:stretch}
  .result .scorebox{flex:0 0 auto;text-align:center;padding:24px 30px;background:rgba(255,255,255,.04);display:flex;flex-direction:column;justify-content:center;min-width:138px}
  .result .scorebox .big{font-size:54px;font-weight:800;line-height:1;letter-spacing:-0.04em}
  .result .scorebox .big.code{font-size:40px}
  .result .scorebox .cap{font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#7fae98;margin-top:8px}
  .result .reco{flex:1;padding:22px 24px;display:flex;flex-direction:column;justify-content:center}
  .result .reco .tag{display:inline-block;align-self:flex-start;font-weight:700;font-size:12.5px;letter-spacing:.02em;padding:6px 14px;border-radius:999px;margin-bottom:10px}
  .result .reco .desc{font-size:16px;line-height:1.5;color:#eef7f1;font-weight:400}
  .result .reco .desc b{font-weight:700;color:#fff}
  .tag.non{background:#27a06f;color:#fff}
  .tag.choice{background:var(--accent);color:#2a230a}
  .tag.surg{background:#e06753;color:#fff}
  .tag.code{background:#3a7fd0;color:#fff}

  .note{font-size:12.5px;color:var(--muted);line-height:1.65;margin-top:20px;font-weight:400}
  .note strong{color:var(--ink);font-weight:600}
  .reset{display:inline-block;margin-top:18px;font-size:13.5px;font-weight:600;color:var(--green);background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:10px 18px;cursor:pointer;font-family:var(--sans);transition:.16s}
  .reset:hover{border-color:var(--green);background:var(--green-l)}
  footer{font-size:11.5px;color:#8aa094;margin-top:32px;line-height:1.7;font-weight:400}

  /* ===== Placeholder ===== */
  .placeholder{background:var(--panel);border:1.5px dashed var(--line);border-radius:var(--r);padding:56px 32px;text-align:center;margin-top:26px}
  .placeholder .ic{width:58px;height:58px;border-radius:16px;background:var(--green-l);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;margin:0 auto 18px}
  .placeholder h3{margin:0 0 10px;font-size:21px;font-weight:700;letter-spacing:-0.02em}
  .placeholder p{margin:0 auto;max-width:460px;color:var(--muted);font-size:15px;line-height:1.6}

  @media (min-width:560px){.opts{grid-template-columns:1fr 1fr}}
  @media (max-width:520px){
    .pagehead h1{font-size:28px}
    .result .scorebar{flex-direction:column}
    .result .scorebox{min-width:0;padding:20px}
    .result .scorebox .big{font-size:46px}
  }
</style>
</head>

<script>
/* =========================================================
   CALCULATOR REGISTRY
   mode "score"   -> options carry {v}; result = sum + interpret(total)
   mode "classify"-> options carry {code}; result = assemble(state)
   group.type     -> "radio" (default), "multi" (checkboxes), "text"
   ========================================================= */
var CALCULATORS = [

  /* ---------------- TLICS ---------------- */
  {
    id:"tlics", abbr:"TLICS", name:"TLICS Score",
    full:"Thoracolumbar Injury Classification & Severity",
    subtitle:"Thoracolumbar Injury Classification and Severity Score",
    region:"Thoracolumbar", mode:"score",
    groups:[
      {key:"morph",title:"Injury Morphology",hint:"Radiographs · CT",options:[
        {t:"Compression",v:1},{t:"Burst",v:2},{t:"Translation / rotation",v:3},{t:"Distraction",v:4}
      ]},
      {key:"plc",title:"Posterior Ligamentous Complex",hint:"MRI",options:[
        {t:"Intact",v:0},{t:"Suspected / indeterminate",v:2},{t:"Injured",v:3}
      ]},
      {key:"neuro",title:"Neurologic Status",hint:"Physical examination",options:[
        {t:"Intact",v:0},{t:"Nerve root involvement",v:2},
        {t:"Cord / conus — incomplete",v:3},{t:"Cord / conus — complete",v:2},
        {t:"Cauda equina syndrome",v:3}
      ]}
    ],
    interpret:function(t){
      if(t<=3) return {cls:"non",tag:"Non-operative",desc:"Non-surgical management is generally recommended."};
      if(t===4) return {cls:"choice",tag:"Surgeon's choice",desc:"Equivocal injury — operative or non-operative management at the surgeon's discretion."};
      return {cls:"surg",tag:"Surgical",desc:"Surgical management is generally recommended."};
    },
    note:"TLICS total ≤ 3 favours non-operative management; a total of 4 is equivocal (surgeon's choice); a total ≥ 5 favours surgical management. Where more than one neurologic finding is present, score the highest applicable value.",
    ref:"Based on Vaccaro AR et al., the Thoracolumbar Injury Classification and Severity Score (TLICS)."
  },

  /* ---------------- SLIC ---------------- */
  {
    id:"slic", abbr:"SLIC", name:"SLIC Score",
    full:"Subaxial Cervical Spine Injury Classification",
    subtitle:"Subaxial Injury Classification and Severity Scale (SLICS)",
    region:"Cervical", mode:"score",
    groups:[
      {key:"morph",title:"Injury Morphology",hint:"Radiographs · CT",options:[
        {t:"No abnormality",v:0},{t:"Compression",v:1},{t:"Burst",v:2},
        {t:"Distraction",v:3},{t:"Translation / rotation",v:4}
      ]},
      {key:"dlc",title:"Disco-Ligamentous Complex",hint:"MRI",options:[
        {t:"Intact",v:0},{t:"Indeterminate",v:1},{t:"Disrupted",v:2}
      ]},
      {key:"neuro",title:"Neurologic Status",hint:"Physical examination",options:[
        {t:"Intact",v:0},{t:"Nerve root injury",v:1},
        {t:"Complete cord injury",v:2},{t:"Incomplete cord injury",v:3}
      ]},
      {key:"compress",title:"Continued Cord Compression",hint:"With a neurologic deficit",options:[
        {t:"No",v:0},{t:"Yes (+1)",v:1}
      ]}
    ],
    interpret:function(t){
      if(t<=3) return {cls:"non",tag:"Non-operative",desc:"Non-surgical management is generally recommended."};
      if(t===4) return {cls:"choice",tag:"Surgeon's choice",desc:"Equivocal injury — operative or non-operative management at the surgeon's discretion."};
      return {cls:"surg",tag:"Surgical",desc:"Surgical (operative) management is generally recommended."};
    },
    note:"SLIC total ≤ 3 favours non-operative management; a total of 4 is equivocal (surgeon's discretion); a total ≥ 5 favours operative management. “Continued cord compression” adds 1 point only in the setting of an associated neurologic deficit.",
    ref:"Based on Vaccaro AR et al., the Subaxial Injury Classification (SLIC) and Severity Scale. Spine. 2007."
  },

  /* ---------------- AO Spine Subaxial ---------------- */
  {
    id:"aosub", abbr:"AO", name:"AO Spine Subaxial",
    full:"AO Spine Subaxial Cervical Spine Injury Classification",
    subtitle:"AO Spine Subaxial Cervical Spine Injury Classification System",
    region:"Cervical", mode:"classify",
    groups:[
      {key:"level",title:"Spinal Level",hint:"Optional",type:"text",placeholder:"e.g., C6–C7"},
      {key:"morph",title:"Fracture Morphology",hint:"Required",options:[
        {t:"A0 — Minor / nonstructural fracture",code:"A0"},
        {t:"A1 — Wedge-compression",code:"A1"},
        {t:"A2 — Split (pincer)",code:"A2"},
        {t:"A3 — Incomplete burst",code:"A3"},
        {t:"A4 — Complete burst",code:"A4"},
        {t:"B1 — Posterior tension band, bony",code:"B1"},
        {t:"B2 — Posterior tension band, capsuloligamentous",code:"B2"},
        {t:"B3 — Anterior tension band (hyperextension)",code:"B3"},
        {t:"C — Translational injury",code:"C"}
      ]},
      {key:"facet",title:"Facet Injury",hint:"Optional",options:[
        {t:"None",code:""},
        {t:"F1 — Nondisplaced facet fracture",code:"F1"},
        {t:"F2 — Facet fracture, potential instability",code:"F2"},
        {t:"F3 — Floating lateral mass",code:"F3"},
        {t:"F4 — Subluxation / perched / dislocated",code:"F4"},
        {t:"BL — Bilateral injury",code:"BL"}
      ]},
      {key:"neuro",title:"Neurologic Status",hint:"Required",options:[
        {t:"N0 — Neurology intact",code:"N0"},
        {t:"N1 — Transient deficit",code:"N1"},
        {t:"N2 — Radicular symptoms",code:"N2"},
        {t:"N3 — Incomplete cord / any cauda equina",code:"N3"},
        {t:"N4 — Complete cord injury",code:"N4"},
        {t:"NX — Cannot be examined",code:"NX"}
      ]},
      {key:"mods",title:"Case-Specific Modifiers",hint:"Select all that apply",type:"multi",options:[
        {t:"M1 — PLC injury without complete disruption",code:"M1"},
        {t:"M2 — Critical disc herniation",code:"M2"},
        {t:"M3 — Stiffening / metabolic bone disease",code:"M3"},
        {t:"M4 — Vertebral artery abnormality",code:"M4"},
        {t:"+ — Continued cord compression",code:"+"}
      ]}
    ],
    assemble:function(s){
      var morph=s.morph, facet=s.facet, neuro=s.neuro, mods=s.mods||[], level=(s.level||"").trim();
      var head = morph ? morph.code : (facet && facet.code ? facet.code : "—");
      var codeParts=[];
      if(morph) codeParts.push(morph.code);
      if(facet && facet.code) codeParts.push(facet.code);
      var paren=[];
      if(neuro) paren.push(neuro.code);
      mods.forEach(function(m){ paren.push(m.code); });
      var code = codeParts.join(", ");
      if(paren.length) code += " (" + paren.join(", ") + ")";
      if(level && code) code = level + ": " + code;
      return { head:head, code:code || "—",
        ready:!!(morph && neuro),
        missing:(!morph?"morphology":"")+((!morph&&!neuro)?" and ":"")+(!neuro?"neurologic status":"") };
    },
    note:"The AO Spine subaxial system is a morphologic classification, not an additive score. It records fracture morphology (A/B/C), facet injury (F/BL), neurology (N), and case-specific modifiers (M). Management follows the injury hierarchy and clinical context rather than a numeric cut-off. If only facet injuries are present, they are listed first after the level.",
    ref:"Based on Vaccaro AR et al., AO Spine Subaxial Cervical Spine Injury Classification System. Eur Spine J / Global Spine J."
  },

  /* ---------------- Reserved slots ---------------- */
  { id:"asia", abbr:"ASIA", name:"ASIA Grade", full:"ASIA Impairment Scale",                     region:"Neurologic", soon:true },
  { id:"mjoa", abbr:"mJOA", name:"mJOA Score",  full:"modified Japanese Orthopaedic Association", region:"Myelopathy", soon:true }
];

/* ===================== App ===================== */
var state = {};
var current = CALCULATORS[0];
var navEl = document.getElementById('nav');
var mobEl = document.getElementById('mobnav');
var viewEl = document.getElementById('view');

function buildNav(){
  navEl.innerHTML=''; mobEl.innerHTML='';
  CALCULATORS.forEach(function(c){
    var b=document.createElement('button');
    b.className='navitem'+(c.id===current.id?' active':'')+(c.soon?' soon':'');
    b.innerHTML='<span class="ab">'+c.abbr+'</span><span>'+c.name+'</span>'+(c.soon?'<span class="soonpill">Soon</span>':'');
    if(!c.soon) b.addEventListener('click',function(){select(c.id);});
    navEl.appendChild(b);
    var o=document.createElement('option');
    o.value=c.id; o.textContent=c.name+(c.soon?'  (soon)':''); o.disabled=!!c.soon;
    if(c.id===current.id) o.selected=true;
    mobEl.appendChild(o);
  });
}
mobEl.addEventListener('change',function(){select(this.value);});

function select(id){
  var c=CALCULATORS.find(function(x){return x.id===id;});
  if(!c||c.soon) return;
  current=c; state={}; buildNav(); render(); window.scrollTo(0,0);
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function optionTxt(t){
  var dash=t.indexOf(' — ');
  if(dash>-1){ return '<span class="txt">'+esc(t.slice(0,dash))+'<span class="sub">'+esc(t.slice(dash+3))+'</span></span>'; }
  return '<span class="txt">'+esc(t)+'</span>';
}

function render(){
  if(current.soon){ renderPlaceholder(); return; }
  var classify = current.mode==='classify';
  var html='';
  html+='<div class="pagehead"><span class="kicker">'+current.region+' · Decision Support</span>'+
        '<h1>'+current.name+'</h1><p>'+current.subtitle+'</p></div>';
  html+='<div class="card"><h2>'+(classify?'Injury Classification':'Injury Assessment')+'</h2>';
  current.groups.forEach(function(g,gi){
    var multi=g.type==='multi';
    html+='<div class="group"><div class="label"><span class="num">'+(gi+1)+'</span><h3>'+g.title+'</h3>'+
          (multi?'<span class="opt-multi">multi</span>':'')+
          '<span class="hint">'+g.hint+'</span></div>';
    if(g.type==='text'){
      html+='<input class="textfield" type="text" data-group="'+g.key+'" data-type="text" placeholder="'+esc(g.placeholder||'')+'">';
    }else{
      html+='<div class="opts">';
      g.options.forEach(function(o){
        var pill = (o.code!==undefined) ? (o.code===''?'—':esc(o.code)) : o.v;
        var inputType = multi?'checkbox':'radio';
        html+='<label class="opt"><input type="'+inputType+'" name="'+g.key+'" '+
              'data-group="'+g.key+'" data-type="'+(multi?'multi':'radio')+'" '+
              'data-label="'+esc(o.t)+'" '+
              (o.code!==undefined?('data-code="'+esc(o.code)+'"'):('value="'+o.v+'"'))+'>'+
              '<span class="dot'+(multi?' sq':'')+'"></span>'+optionTxt(o.t)+
              '<span class="pts">'+pill+'</span></label>';
      });
      html+='</div>';
    }
    html+='</div>';
  });
  html+='<button class="reset" id="reset" type="button">Reset</button></div>';

  if(classify){
    html+='<div class="result"><div class="equation" id="equation">Select fracture morphology and neurologic status to build the classification.</div>'+
          '<div class="scorebar"><div class="scorebox"><span class="big code" id="total">—</span><span class="cap">Type</span></div>'+
          '<div class="reco"><span class="tag code" id="tag">AO Spine class</span><span class="desc" id="desc">Choose each category above.</span></div></div></div>';
  }else{
    html+='<div class="result"><div class="equation" id="equation">Select an option in each category to calculate the total.</div>'+
          '<div class="scorebar"><div class="scorebox"><span class="big" id="total">0</span><span class="cap">Total Points</span></div>'+
          '<div class="reco"><span class="tag non" id="tag">Awaiting input</span><span class="desc" id="desc">Choose each category above.</span></div></div></div>';
  }
  if(current.note) html+='<p class="note"><strong>Interpretation.</strong> '+current.note+'</p>';
  html+='<footer>'+(current.ref||'')+'<br>For clinical and educational use. Verify all decisions against current institutional protocol.</footer>';
  viewEl.innerHTML=html;

  viewEl.querySelectorAll('input').forEach(function(el){
    el.addEventListener('change',function(){ readGroup(el.dataset.group); update(); });
  });
  viewEl.querySelectorAll('input[data-type=text]').forEach(function(el){
    el.addEventListener('input',function(){ state[el.dataset.group]=el.value; update(); });
  });
  document.getElementById('reset').addEventListener('click',function(){
    state={};
    viewEl.querySelectorAll('input').forEach(function(el){ if(el.type==='text'){el.value='';}else{el.checked=false;} });
    update();
  });
  update();
}

function readGroup(key){
  var checked=viewEl.querySelectorAll('input[data-group="'+key+'"]:checked');
  if(checked.length===0){ delete state[key]; return; }
  var first=checked[0];
  if(first.dataset.type==='multi'){
    state[key]=Array.prototype.map.call(checked,function(el){
      return {t:el.dataset.label, code:el.dataset.code};
    });
  }else{
    var el=first;
    state[key]= (el.dataset.code!==undefined)
      ? {t:el.dataset.label, code:el.dataset.code}
      : {t:el.dataset.label, v:parseInt(el.value,10)};
  }
}

function renderPlaceholder(){
  viewEl.innerHTML='<div class="pagehead"><span class="kicker">'+current.region+'</span><h1>'+current.name+'</h1>'+
    '<p>'+current.full+'</p></div>'+
    '<div class="placeholder"><div class="ic">+</div><h3>Reserved for an upcoming calculator</h3>'+
    '<p>This slot is ready for the '+current.full+'. The framework already supports it — supply the categories, point values, and interpretation, and it appears here automatically.</p></div>';
}

function update(){
  if(current.mode==='classify'){ updateClassify(); return; }
  updateScore();
}

function updateScore(){
  var keys=current.groups.map(function(g){return g.key;});
  var chosen=keys.filter(function(k){return state[k];});
  var total=keys.reduce(function(s,k){return s+(state[k]?state[k].v:0);},0);
  var complete=chosen.length===keys.length;
  var eqEl=document.getElementById('equation'), totalEl=document.getElementById('total');
  var tagEl=document.getElementById('tag'), descEl=document.getElementById('desc');
  if(chosen.length===0){
    eqEl.innerHTML='Select an option in each category to calculate the total.';
    totalEl.textContent='0';
    tagEl.className='tag non'; tagEl.textContent='Awaiting input';
    descEl.textContent='Choose each category above.';
    return;
  }
  var parts=keys.filter(function(k){return state[k];}).map(function(k){return esc(state[k].t)+' <b>'+state[k].v+'</b>';});
  eqEl.innerHTML=parts.join('  +  ')+'  =  <b>'+total+' point'+(total===1?'':'s')+'</b>'+
    (complete?'':'  <span style="color:#7fae98">(incomplete — select all categories)</span>');
  totalEl.textContent=total;
  var r=current.interpret(total);
  tagEl.className='tag '+r.cls; tagEl.textContent=r.tag;
  descEl.textContent=r.desc+(complete?'':' Complete all categories for a final recommendation.');
}

function updateClassify(){
  var eqEl=document.getElementById('equation'), headEl=document.getElementById('total');
  var tagEl=document.getElementById('tag'), descEl=document.getElementById('desc');
  var any=current.groups.some(function(g){ return state[g.key] && (g.type!=='text'); });
  var parts=[];
  current.groups.forEach(function(g){
    var v=state[g.key];
    if(!v) return;
    if(g.type==='text'){ if(v) parts.push('<b>'+esc(v)+'</b>'); }
    else if(g.type==='multi'){ if(v.length) parts.push(esc(g.title)+': <b>'+v.map(function(x){return esc(x.code);}).join(', ')+'</b>'); }
    else { parts.push(esc(g.title)+': <b>'+esc(v.code||'none')+'</b>'); }
  });
  var res=current.assemble(state);
  headEl.textContent=res.head;
  if(!any){
    eqEl.innerHTML='Select fracture morphology and neurologic status to build the classification.';
    descEl.innerHTML='Choose each category above.';
    return;
  }
  eqEl.innerHTML=parts.join('  ·  ');
  if(res.ready){
    descEl.innerHTML='Classification: <b>'+esc(res.code)+'</b>';
  }else{
    descEl.innerHTML='Provisional: <b>'+esc(res.code)+'</b><span style="color:#7fae98"> — add '+res.missing+'</span>';
  }
}

buildNav();
render();
</script>
</body>
</html>
